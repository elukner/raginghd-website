<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C10" />
      <stop offset="100%" stop-color="#12151F" />
    </linearGradient>

    <!-- Skull Metallic Gradient -->
    <linearGradient id="skullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="65%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Electric Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Accent Cyber Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Neon Glow Filter for Lightning Eyes -->
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Hex / Shield Badge -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="6" />
  
  <!-- Subtle Tech Grid Lines -->
  <line x1="24" y1="256" x2="488" y2="256" stroke="#1E293B" stroke-width="2" stroke-dasharray="8 8" />
  <line x1="256" y1="24" x2="256" y2="488" stroke="#1E293B" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Skull Main Cranium & Jaw (Fully smooth on top) -->
  <path d="M256 84
           C164 84 108 142 108 224
           C108 264 124 298 148 318
           L140 356
           C138 368 148 378 160 378
           L180 378
           L180 416
           C180 428 190 436 202 436
           L310 436
           C322 436 332 428 332 416
           L332 378
           L352 378
           C364 378 374 368 372 356
           L364 318
           C388 298 404 264 404 224
           C404 142 348 84 256 84 Z" fill="url(#skullGrad)" stroke="#0F172A" stroke-width="10" stroke-linejoin="round" />

  <!-- Cheekbone / Temple Geometric Cutouts -->
  <path d="M126 250 L158 286 L146 318" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M386 250 L354 286 L366 318" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dark Eye Sockets (Base Backing) -->
  <polygon points="148,220 228,212 218,284 156,276" fill="#090A0F" stroke="#1E293B" stroke-width="4" stroke-linejoin="round" />
  <polygon points="364,220 284,212 294,284 356,276" fill="#090A0F" stroke="#1E293B" stroke-width="4" stroke-linejoin="round" />

  <!-- Nasal Cavity (Inverted Geometric Triangle) -->
  <polygon points="256,274 232,332 256,322 280,332" fill="#090A0F" stroke="#1E293B" stroke-width="4" stroke-linejoin="round" />

  <!-- Teeth / Grill Vertical Separators -->
  <line x1="210" y1="368" x2="210" y2="432" stroke="#090A0F" stroke-width="8" stroke-linecap="round" />
  <line x1="240" y1="368" x2="240" y2="432" stroke="#090A0F" stroke-width="8" stroke-linecap="round" />
  <line x1="272" y1="368" x2="272" y2="432" stroke="#090A0F" stroke-width="8" stroke-linecap="round" />
  <line x1="302" y1="368" x2="302" y2="432" stroke="#090A0F" stroke-width="8" stroke-linecap="round" />

  <!-- LEFT LIGHTNING BOLT EYE -->
  <polygon points="206,158 152,242 190,242 164,316 236,222 194,222" fill="url(#boltGrad)" filter="url(#boltGlow)" />

  <!-- RIGHT LIGHTNING BOLT EYE -->
  <polygon points="306,158 360,242 322,242 348,316 276,222 318,222" fill="url(#boltGrad)" filter="url(#boltGlow)" />
</svg>